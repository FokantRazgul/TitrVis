name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/acid-base-titration-simulator-gtsxg3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm test
      # The site is served from https://<owner>.github.io/<repo>/, so assets need that prefix.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # One-time repository setup (the workflow token cannot do this itself):
      #   Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
      # Until then this step fails with "Not Found" and nothing is published.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
